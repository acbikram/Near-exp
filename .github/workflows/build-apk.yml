name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    # Decode the signing keystore from the repo secret into release.jks at the
    # project root. If the secret is empty (not configured), this writes an
    # empty file and the build falls back to debug signing.
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          # Strip any stray whitespace/newlines that may have crept into the
          # secret, then decode. -i ignores non-alphabet chars as a safety net.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d -i > release.jks
          echo "Keystore decoded ($(wc -c < release.jks) bytes)."
        else
          echo "No KEYSTORE_BASE64 secret set — release will be debug-signed."
        fi

    - name: Build signed release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release*.apk

    # Read versionName / versionCode straight from the Gradle file so the
    # release tag encodes both. The in-app updater parses "+<versionCode>"
    # from the tag to decide if a newer build exists.
    - name: Read version
      id: ver
      run: |
        VN=$(grep -E 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
        VC=$(grep -E 'versionCode = ' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
        echo "version_name=$VN" >> "$GITHUB_OUTPUT"
        echo "version_code=$VC" >> "$GITHUB_OUTPUT"
        echo "Detected versionName=$VN versionCode=$VC"

    # Give the APK a versioned name for the release asset.
    - name: Stage release APK
      if: github.event_name == 'push'
      run: |
        mkdir -p release-out
        SRC=$(ls app/build/outputs/apk/release/app-release*.apk | head -1)
        cp "$SRC" "release-out/NearExpiry-v${{ steps.ver.outputs.version_name }}.apk"

    # Publish (or overwrite) a GitHub Release tagged v<name>+<code> with the
    # signed APK attached. The in-app "Check for Updates" finds this.
    - name: Publish GitHub Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.ver.outputs.version_name }}+${{ steps.ver.outputs.version_code }}
        name: Near Expiry v${{ steps.ver.outputs.version_name }}
        body: |
          Automated release.
          versionCode: ${{ steps.ver.outputs.version_code }}
        files: release-out/NearExpiry-v${{ steps.ver.outputs.version_name }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
