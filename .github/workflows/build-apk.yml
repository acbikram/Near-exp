name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    # Decode the signing keystore from the repo secret into release.jks at the
    # project root. If the secret is empty (not configured), this writes an
    # empty file and the build falls back to debug signing.
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          # Strip any stray whitespace/newlines that may have crept into the
          # secret, then decode. -i ignores non-alphabet chars as a safety net.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d -i > release.jks
          echo "Keystore decoded ($(wc -c < release.jks) bytes)."
        else
          echo "No KEYSTORE_BASE64 secret set — release will be debug-signed."
        fi

    - name: Build signed release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: gradle assembleRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release*.apk
