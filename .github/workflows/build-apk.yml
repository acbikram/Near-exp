name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    name: Test and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # setup-gradle reads the committed wrapper metadata, so local and CI builds
    # use the exact same Gradle version and wrapper checksum.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Verify Gradle wrapper
      run: ./gradlew --version --no-daemon

    - name: Run debug unit tests
      run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

    - name: Run debug lint
      run: ./gradlew lintDebug --stacktrace --no-daemon

    # Preserve reports whenever a quality gate fails, so failures can be
    # diagnosed directly from the workflow instead of reproducing blindly.
    - name: Upload test reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: app/build/reports/tests/
        if-no-files-found: ignore

    - name: Upload lint reports on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: app/build/reports/lint-results-*.html
        if-no-files-found: ignore

  release:
    name: Build and publish release
    # Pull requests run the quality gates only. A signed release is created
    # only for an accepted push to main, after those gates have passed.
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # Decode the signing keystore from the repo secret into release.jks at the
    # project root. If the secret is empty (not configured), the Android build
    # falls back to debug signing for the release artifact.
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d -i > release.jks
          echo "Keystore decoded ($(wc -c < release.jks) bytes)."
        else
          echo "No KEYSTORE_BASE64 secret set — release will be debug-signed."
        fi

    - name: Build signed release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/app-release*.apk
        if-no-files-found: error

    # Read versionName / versionCode straight from the Gradle file so the
    # release tag encodes both. The in-app updater parses "+<versionCode>"
    # from the tag to decide if a newer build exists.
    - name: Read version
      id: ver
      run: |
        VN=$(grep -E 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*versionName = "([^"]+)".*/\1/')
        VC=$(grep -E 'versionCode = ' app/build.gradle.kts | head -1 | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
        test -n "$VN"
        test -n "$VC"
        echo "version_name=$VN" >> "$GITHUB_OUTPUT"
        echo "version_code=$VC" >> "$GITHUB_OUTPUT"
        echo "Detected versionName=$VN versionCode=$VC"

    - name: Stage release APK
      run: |
        mkdir -p release-out
        SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name 'app-release*.apk' -print -quit)
        test -n "$SRC"
        cp "$SRC" "release-out/NearExpiry-v${{ steps.ver.outputs.version_name }}.apk"

    # Publish (or overwrite) a GitHub Release tagged v<name>+<code> with the
    # signed APK attached. The in-app "Check for Updates" finds this release.
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.ver.outputs.version_name }}+${{ steps.ver.outputs.version_code }}
        name: Near Expiry v${{ steps.ver.outputs.version_name }}
        body: |
          Automated release.
          versionCode: ${{ steps.ver.outputs.version_code }}
        files: release-out/NearExpiry-v${{ steps.ver.outputs.version_name }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
